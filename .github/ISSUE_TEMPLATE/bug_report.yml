name: Bug report
description: Something doesn't work as it should
labels:
  - bug

body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you saw, with the exact error message or a screenshot.
    validations:
      required: true

  - type: textarea
    id: what-should-happen
    attributes:
      label: What should happen
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: Where
      description: Environment, version or commit, browser or OS if it matters.
    validations:
      required: true
