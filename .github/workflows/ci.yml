# GitHub Actions. The GitLab equivalent is .gitlab-ci.yml; both only pass the platform's
# values to the scripts in scripts/checks/, which hold every check. Shown on PRs as
# "Checks / <job name>".
# Every third-party action is pinned to a commit SHA, with its tag in the comment.
# Runner: the CI_RUNS_ON repository or organization variable, as JSON: "ubuntu-latest" (the
# default when unset) or ["self-hosted", "linux"]. Nothing in this file names a host.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
    # `edited`: re-check when only the PR title or description changes.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Same checks as the git hooks, so skipping hooks with --no-verify doesn't get past review.
  commit-message:
    name: Commit message
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PRs are squash-merged: the title becomes the commit on main, and
      # the branch's own commits don't land.
      - name: Conventional PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint --verbose
      - name: Conventional commits (pushed commit)
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

  # <type>/<issue number>/<short-description>, e.g. fix/17/login-timeout;
  # the number is left out when there's no issue. Same check as the pre-push hook.
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - env:
          BRANCH: ${{ github.head_ref }}
        run: node scripts/checks/branch-name.mjs "$BRANCH"

  # Follows .github/pull_request_template.md (scripts/checks/pr-description.mjs).
  # Re-runs when the description is edited (`edited` above). The body goes in
  # through env, never into the script, so its text can't run.
  pr-description:
    name: PR description
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: node scripts/checks/pr-description.mjs

  # Every relative link in every Markdown file points to a file that exists,
  # so moving a file can't leave docs pointing at nothing.
  markdown-links:
    name: Markdown links resolve
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node scripts/checks/markdown-links.mjs

  # Every tracked .json file must parse.
  json:
    name: JSON files parse
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node scripts/checks/json-valid.mjs

  # One build job per stack follows, from presets/<stack>/github-job.yml in the baseline repo.
