build-python:
  # Overridden by a CI/CD variable of the same name, e.g. an on-prem registry's mirror.
  image: $UV_IMAGE
  variables:
    UV_IMAGE: ghcr.io/astral-sh/uv:python3.12-bookworm
    AREA_DIR: .
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache/]
  script:
    - cd "$AREA_DIR"
    # Fails when uv.lock is missing or out of date with pyproject.toml.
    - uv sync --locked
    - uv run ruff format --check .
    - uv run ruff check .
    - uv run mypy .
    - uv run pytest
