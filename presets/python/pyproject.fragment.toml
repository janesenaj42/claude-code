# The root CLAUDE.md "Code review standards" rules a linter can check. Merge into pyproject.toml.

[tool.ruff.lint]
extend-select = [
  "ANN401",  # no typing.Any in annotations
  "PLR0915", # too many statements in one function (Ruff has no line count)
  "PLR2004", # magic values in comparisons
]

[tool.ruff.lint.pylint]
max-statements = 30

[tool.ruff.lint.per-file-ignores]
# Tests describe cases with literal values.
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
# Any written out in the code, which ANN401 misses outside annotations (casts, generics).
disallow_any_explicit = true
