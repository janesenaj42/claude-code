build-ts:
  image: $NODE_IMAGE
  variables:
    AREA_DIR: .
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  script:
    - cd "$AREA_DIR"
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline
    - npm run format:check
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run build
