build-java:
  # Overridden by a CI/CD variable of the same name, e.g. an on-prem registry's mirror.
  image: $JAVA_IMAGE
  variables:
    JAVA_IMAGE: eclipse-temurin:21
    AREA_DIR: .
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
  cache:
    key: gradle-$CI_JOB_NAME
    paths: [.gradle-home/caches/, .gradle-home/wrapper/]
  script:
    - cd "$AREA_DIR"
    # check = spotlessCheck + checkstyleMain + test; build adds the jar.
    - sh ./gradlew build
